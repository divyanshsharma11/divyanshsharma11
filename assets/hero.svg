<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320" role="img" aria-label="Divyansh Sharma, Backend and Integration Engineer: data flowing from platforms through an integration service, queue and worker into the product">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
    .pill{fill:#161b22;stroke:#30363d;stroke-width:1.2}
    .box{fill:#161b22;stroke:#3b82f6;stroke-width:1.4}
    .wire{fill:none;stroke:#30363d;stroke-width:1.4}
    .lbl{fill:#e6edf3;font-size:14px}
    .sub{fill:#8b949e;font-size:11.5px}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>

  <rect x="0" y="0" width="1100" height="320" rx="16" fill="#0d1117"/>

  <!-- header -->
  <text x="36" y="44" class="mono" font-size="13" fill="#7ee787">~/divyansh $ <tspan fill="#e6edf3">whoami</tspan><tspan class="cursor" fill="#e6edf3"> ▍</tspan></text>
  <text x="36" y="82" class="sans" font-size="30" font-weight="700" fill="#ffffff">Backend &amp; Integration Engineer</text>
  <text x="36" y="108" class="mono" font-size="13" fill="#8b949e">OAuth 2.0 · webhooks · queues &amp; workers · Node.js · Python · GCP</text>

  <!-- wires: platforms -> service -->
  <path id="w1" class="wire" d="M196 151 C 250 151, 250 213, 300 213"/>
  <path id="w2" class="wire" d="M196 185 C 250 185, 250 213, 300 213"/>
  <path id="w3" class="wire" d="M196 219 C 250 219, 250 213, 300 213"/>
  <path id="w4" class="wire" d="M196 253 C 250 253, 250 213, 300 213"/>
  <path id="w5" class="wire" d="M196 287 C 250 287, 250 213, 300 213"/>
  <!-- pipeline wires -->
  <path id="p1" class="wire" d="M480 213 L 540 213"/>
  <path id="p2" class="wire" d="M700 213 L 760 213"/>
  <path id="p3" class="wire" d="M880 213 L 920 213"/>

  <!-- platform pills -->
  <g class="mono">
    <rect class="pill" x="36" y="138" width="160" height="26" rx="13"><animate attributeName="stroke" values="#30363d;#635bff;#30363d" dur="5s" begin="0s" repeatCount="indefinite"/></rect>
    <text x="116" y="156" text-anchor="middle" class="lbl" font-size="12.5">Stripe</text>
    <rect class="pill" x="36" y="172" width="160" height="26" rx="13"><animate attributeName="stroke" values="#30363d;#ff7a59;#30363d" dur="5s" begin="1s" repeatCount="indefinite"/></rect>
    <text x="116" y="190" text-anchor="middle" class="lbl" font-size="12.5">HubSpot</text>
    <rect class="pill" x="36" y="206" width="160" height="26" rx="13"><animate attributeName="stroke" values="#30363d;#ea4335;#30363d" dur="5s" begin="2s" repeatCount="indefinite"/></rect>
    <text x="116" y="224" text-anchor="middle" class="lbl" font-size="12.5">Gmail · Pub/Sub</text>
    <rect class="pill" x="36" y="240" width="160" height="26" rx="13"><animate attributeName="stroke" values="#30363d;#2dd4bf;#30363d" dur="5s" begin="3s" repeatCount="indefinite"/></rect>
    <text x="116" y="258" text-anchor="middle" class="lbl" font-size="12.5">Cloudbeds</text>
    <rect class="pill" x="36" y="274" width="160" height="26" rx="13"><animate attributeName="stroke" values="#30363d;#22c55e;#30363d" dur="5s" begin="4s" repeatCount="indefinite"/></rect>
    <text x="116" y="292" text-anchor="middle" class="lbl" font-size="12.5">Athenahealth</text>
  </g>

  <!-- pipeline boxes -->
  <g class="sans">
    <rect class="box" x="300" y="185" width="180" height="56" rx="10"/>
    <text x="390" y="209" text-anchor="middle" class="lbl" font-weight="600">Integration service</text>
    <text x="390" y="228" text-anchor="middle" class="sub mono">OAuth · verify signatures</text>

    <rect class="box" x="540" y="185" width="160" height="56" rx="10" style="stroke:#f59e0b"/>
    <text x="620" y="209" text-anchor="middle" class="lbl" font-weight="600">Redis + BullMQ</text>
    <text x="620" y="228" text-anchor="middle" class="sub mono">queue · retry</text>

    <rect class="box" x="760" y="185" width="120" height="56" rx="10" style="stroke:#a78bfa"/>
    <text x="820" y="209" text-anchor="middle" class="lbl" font-weight="600">Worker</text>
    <text x="820" y="228" text-anchor="middle" class="sub mono">process · sync</text>

    <rect class="box" x="920" y="185" width="144" height="56" rx="10" style="stroke:#22c55e"/>
    <text x="992" y="209" text-anchor="middle" class="lbl" font-weight="600">Product</text>
    <text x="992" y="228" text-anchor="middle" class="sub mono">AI agent · CRM</text>
  </g>

  <!-- packets: platforms -> service -->
  <circle r="4" fill="#635bff"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.2;1" calcMode="linear"><mpath href="#w1"/></animateMotion></circle>
  <circle r="4" fill="#ff7a59"><animateMotion dur="5s" begin="1s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.2;1" calcMode="linear"><mpath href="#w2"/></animateMotion></circle>
  <circle r="4" fill="#ea4335"><animateMotion dur="5s" begin="2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.2;1" calcMode="linear"><mpath href="#w3"/></animateMotion></circle>
  <circle r="4" fill="#2dd4bf"><animateMotion dur="5s" begin="3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.2;1" calcMode="linear"><mpath href="#w4"/></animateMotion></circle>
  <circle r="4" fill="#22c55e"><animateMotion dur="5s" begin="4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.2;1" calcMode="linear"><mpath href="#w5"/></animateMotion></circle>

  <!-- packets: through the pipeline -->
  <g fill="#e6edf3">
    <circle r="3.5"><animateMotion dur="1s" begin="0.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="1s" begin="0.7s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="0.8s" begin="1s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  </g>

  <!-- status line -->
  <text x="300" y="290" class="mono" font-size="12" fill="#8b949e">200 OK · <tspan fill="#7ee787">20+ platforms integrated</tspan> · 4 years · open to backend &amp; integration roles</text>
</svg>
