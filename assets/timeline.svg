<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 210" width="1100" height="210" role="img" aria-label="Career timeline: Capgemini Engineering from July 2022 (promoted to Associate II in April 2024), Vodex AI from August 2024, M32 AI from December 2025 to August 2026.">
<style>
